schema_version: 1
app: recipe-scraper

canonical_repo: https://github.com/soushinyamaoka/recipe-scraper.git
canonical_ref: main
updated_at: 2026-09-28
verified_against_runtime: null   # VPS管理側がVPS1と照合済みの項目（language_runtime、tls、logging.contains_pii、deploy.entryの実行停止状態）を2026-09-28に反映した。ただし訂正後の全体再照合が済むまでnullを維持する（VPS管理側の指示）。

runtime:
  type: systemd
  unit: recipe-scraper-api.service
  working_directory: /opt/apps/recipe-scraper-api
  user: recipe-scraper    # /etc/systemd/system/recipe-scraper-api.service.d/runtime-user.conf で指定。sourceとvenvはdeploy所有のまま、runtimeは読み取り・実行のみ
  group: recipe-scraper
  language_runtime: python3.10.12   # VPS管理側がVPS1と照合済み（2026-09-28）
  os_packages: []
  restart_policy: always

network:
  listeners:
    - bind: 127.0.0.1   # VPS管理側の監視表で内部health 127.0.0.1:8004 を確認済み。アプリ本体の __main__ にある 0.0.0.0 はローカル開発用で、productionはsystemdのuvicorn起動
      port: 8004
      protocol: http
  public:
    - url: https://recipe-scraper.homehub-tools.dedyn.io
      upstream: 127.0.0.1:8004
      tls: letsencrypt   # VPS管理側がVPS1と照合済み（2026-09-28）。HTTPはHTTPSへ301
  health:
    internal:
      path: /health
      expected_status: 200
      auth_required: false
    public:
      path: /health
      expected_status: 200

config:
  env_file: /opt/apps/recipe-scraper-api/.env   # root:recipe-scraper 0640。runtimeは読み取り可、deployは読み取り不可。deploy artifactに含めない
  env_vars:
    - { name: YOUTUBE_API_KEY, required: false, secret: true }   # YouTube URLの抽出時のみ使用。未設定ならYouTube URLはエラー応答（一般サイトの抽出は動く）
  secret_provisioning: manual

data:
  databases: []
  persistent_paths: []   # 永続データなし（stateless）。復旧に必要なのはsource（Git正本）とVPS上の.env・unit設定
  migrations: none

jobs: []   # 定期処理なし

dependencies:
  internal: []
  external:
    - name: 抽出対象のレシピWebサイト（利用者が指定したURL）
      required: always
    - name: YouTube Data API v3
      required: conditional
      condition: YouTube URLが指定され、かつYOUTUBE_API_KEYが設定されている場合

deploy:
  entry: >
    共通 deploy.bat recipe-scraper-api <LOCAL_DIR> が deploy-files.txt 記載の2ファイル
    （recipe_scraper_api_app.py、requirements.txt）を /opt/apps/recipe-scraper-api/ へscp転送し、
    sshでVPS1の /opt/apps/deploy.sh recipe-scraper-api を実行する（venvへ pip install -r requirements.txt、
    service再起動）。.env は転送しない。専用ラッパー deploy-recipe-scraper-api.bat のLOCAL_DIRはVPS管理側で
    現行パスへ修正済みだが、2026-09-28時点でVPS管理側の判断により明示的に実行停止中（誤実行防止のための
    意図的な停止であり、pathの不備によるものではない）。実行再開はVPS管理側の判断・承認による。
    /opt/apps/deploy.sh はlegacy route。
  downtime: brief-restart
  rollback: >
    反映前に保全した旧2ファイルを同じ経路で再転送し、/opt/apps/deploy.sh recipe-scraper-api を再実行して
    依存の再適用とservice再起動を行い、/health を確認する。

logging:
  destinations: [stdout]
  format: plain
  schema_version: null
  contains_pii: true   # VPS管理側の判断（2026-09-28）。抽出対象URLや取得結果がログに残り得るため
  rotation: null   # アプリ側でログローテーションを持たない
  note: >
    VPS共通ログ規約（1行1JSON構造化、stdout/stderr、job_start/job_end等）は未対応（2026-09-28時点）。
    対応時は application_logging_standard.md に従うこと。

user_impact:
  direct_users: false
  client_apps: [meal-planner]
  user_facing_functions: ["URLからのレシピ取り込み（材料・作り方）"]
